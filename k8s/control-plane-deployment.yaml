apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-control-plane
  labels:
    app: edge-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-control
  template:
    metadata:
      labels:
        app: edge-control
    spec:
      containers:
      - name: control
        image: ghcr.io/your-org/edge-control-plane:latest
        ports:
        - containerPort: 8000
        env:
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/fleet/health
            port: 8000
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/fleet/health
            port: 8000
          initialDelaySeconds: 5
        # prometheus metrics exposed at /metrics
