apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: debug-processor
  template:
    metadata:
      labels:
        app: debug-processor
    spec:
      containers:
      - name: analyzer
        image: ghcr.io/your-org/edge-log-processor:latest
        command: ["python", "debug_pipeline/analyzer.py"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        env:
        - name: DEBUG_LAKE_INTERVAL_SEC
          value: "120"
        volumeMounts:
        - name: debug-vol
          mountPath: /app/data
      volumes:
      - name: debug-vol
        emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: debug-processor-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: debug-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
